spring.application.name=AfterGlow
# H2 Database configuration
spring.datasource.url=jdbc:h2:file:./afterglow_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Serve uploaded files statically from a local "uploads" folder
spring.web.resources.static-locations=classpath:/META-INF/resources/,classpath:/resources/,classpath:/static/,classpath:/public/,file:uploads/

# ---------------------------------------------------------
# FILE UPLOAD LIMITS FOR 2GB VIDEOS
# ---------------------------------------------------------
# Maximum size for a single file
spring.servlet.multipart.max-file-size=2000MB

# Maximum size for the entire multipart request (including text fields)
spring.servlet.multipart.max-request-size=2050MB

# Prevent Tomcat from resetting the connection on massive uploads
server.tomcat.max-swallow-size=2050MB