<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Afterglow — Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background: var(--bg); font-family: var(--sans); }
        .login-box { padding: 40px; background: rgba(14, 22, 48, .72); border-radius: 12px; border: 1px solid rgba(150, 180, 255, .22); width: 100%; max-width: 400px; text-align: center; backdrop-filter: blur(10px); }
        .login-box h2 { font-family: 'Instrument Serif', serif; font-size: 40px; font-weight: 400; margin-bottom: 10px; color: #eef3ff; }
        .login-box p { color: #8ea0c8; margin-bottom: 30px; font-size: 15px; }
        input { width: 100%; margin-bottom: 20px; padding: 14px; border-radius: 10px; border: 1px solid rgba(150, 180, 255, .22); background: rgba(255, 255, 255, .05); color: #fff; font-size: 16px; outline: none; }
        input:focus { border-color: #2f6bff; }
        .cta-btn { width: 100%; padding: 14px; background: #2f6bff; color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: 500; cursor: pointer; transition: 0.2s; }
        .cta-btn:hover { background: #4d82ff; transform: translateY(-1px); }
        .err-msg { color: #ff8a7a; font-size: 14px; margin-top: 15px; min-height: 20px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>After<b>glow</b></h2>
        <p>Log in to the vault.</p>
        <input type="text" id="username" placeholder="Username (e.g., admin_vatsa)" autocomplete="off">
        <input type="password" id="password" placeholder="Password">
        <button id="login-btn" class="cta-btn">Enter Vault</button>
        <div id="login-error" class="err-msg"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="./js/supabase.js"></script>
    <script type="module" src="./js/auth.js"></script>
</body>
</html>
